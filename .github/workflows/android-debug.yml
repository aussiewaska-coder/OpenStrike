name: Android Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Cache Godot downloads
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-4.7.2

      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-4.7.2

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('export_presets.cfg', 'android/location_plugin/**/*.kts', 'android/location_plugin/*.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache Godot imports
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: ${{ runner.os }}-godot-imports-${{ hashFiles('project.godot', 'export_presets.cfg', 'assets/**/*', 'scenes/**/*', 'scripts/**/*') }}
          restore-keys: ${{ runner.os }}-godot-imports-

      - name: Install Android packages (use preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Download Godot 4.7.2
        run: |
          mkdir -p ~/godot-dl ~/godot-bin
          if [ ! -f ~/godot-dl/Godot_v4.7.2-stable_linux.x86_64.zip ]; then
            wget -q -O ~/godot-dl/Godot_v4.7.2-stable_linux.x86_64.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          fi
          if [ ! -f ~/godot-bin/godot ]; then
            unzip -q -o ~/godot-dl/Godot_v4.7.2-stable_linux.x86_64.zip -d ~/godot-bin
            chmod +x ~/godot-bin/Godot_v4.7.2-stable_linux.x86_64
            mv ~/godot-bin/Godot_v4.7.2-stable_linux.x86_64 ~/godot-bin/godot
          fi
          echo "$HOME/godot-bin" >> $GITHUB_PATH
          ~/godot-bin/godot --version

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          if [ -z "$(ls -A ~/.local/share/godot/export_templates/4.7.2.stable 2>/dev/null)" ]; then
            if [ ! -f ~/godot-dl/Godot_v4.7.2-stable_export_templates.tpz ]; then
              wget -q -O ~/godot-dl/Godot_v4.7.2-stable_export_templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
            fi
            unzip -q -o ~/godot-dl/Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot-templates
            mv /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          fi
          ls ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Strip local keystore path (debug uses auto debug key)
        run: |
          sed -i '/keystore\/release/d' export_presets.cfg
          cat export_presets.cfg

      - name: Import + export debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p build/android
          godot --headless --path . --import
          godot --headless --path . --install-android-build-template --export-debug "Android" build/android/OpenStrike-debug.apk
          ls -lh build/android/

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenStrike-debug-apk
          path: build/android/OpenStrike-debug.apk

      - name: Attach APK to GitHub Release (if release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/android/OpenStrike-debug.apk
